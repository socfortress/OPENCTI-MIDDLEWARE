[project]
name = "opencti-lookup"
version = "0.1.0"
description = "Fast Graylog lookup-table backend for OpenCTI indicator enrichment"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",       # brings uvloop + httptools
    "httpx[http2]>=0.27",
    "httpx-sse>=0.4",                # OpenCTI live stream
    "orjson>=3.10",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "numpy>=2.1",                    # packed membership set + searchsorted
    "redis>=5.2",
    "prometheus-client>=0.21",
    "structlog>=24.4",
    "psutil>=6.1",                   # host memory; cgroups read directly
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "respx>=0.21",                   # mocks httpx, for OpenCTI integration tests
    "ruff>=0.8",
    "mypy>=1.13",
]

[project.scripts]
opencti-lookup = "opencti_lookup.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opencti_lookup"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF", "ASYNC", "S"]
ignore = ["S104"]                    # binding 0.0.0.0 is intentional here

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S108"]
# FastAPI's dependency injection is expressed as calls in argument defaults.
"src/opencti_lookup/api/*.py" = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    "error",
    # Third-party deprecations (starlette/anyio/fastapi) are not ours to fix
    # and would otherwise fail collection. Our own code still errors on them.
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
    "ignore:Using `httpx` with `starlette.testclient`:",
    "error::DeprecationWarning:opencti_lookup.*",
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
