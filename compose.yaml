services:
  opencti-lookup:
    # Prebuilt multi-arch image (linux/amd64, linux/arm64) published by CI.
    # Pin a version or digest in production; :latest tracks main.
    image: ghcr.io/socfortress/opencti-middleware:${IMAGE_TAG:-latest}
    pull_policy: always
    # To build from source instead of pulling, comment out `image` above and
    # uncomment this:
    # build: .
    restart: unless-stopped
    env_file: .env
    ports:
      - "${APP_PORT:-8000}:8000"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz',timeout=2).status==200 else 1)"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 40s      # bootstrap can take tens of seconds
    deploy:
      resources:
        limits:
          # The service reads THIS via cgroups, not host RAM, to size itself.
          memory: 2G
    security_opt: ["no-new-privileges:true"]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Default Redis has NO memory limit and will happily consume the box.
    # Both flags are required, not optional.
    command: >
      redis-server
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --save ""
      --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 640M
